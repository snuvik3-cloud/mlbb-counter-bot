<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Counter Picker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-4">

    <h1 class="text-xl font-bold text-center mb-6 text-yellow-500">🛡️ MLBB Draft Helper</h1>

    <!-- Переключатель режимов -->
    <div class="flex justify-between mb-6 bg-slate-800 p-1 rounded-lg">
        <button onclick="switchMode('1v1')" id="btn-1v1" class="w-1/2 py-2 text-center rounded-md font-medium bg-yellow-500 text-slate-900">Режим 1х1</button>
        <button onclick="switchMode('5v5')" id="btn-5v5" class="w-1/2 py-2 text-center rounded-md font-medium text-slate-400">Режим 5х5</button>
    </div>

    <!-- ИНТЕРФЕЙС 1х1 -->
    <div id="mode-1v1" class="space-y-4">
        <label class="block text-sm font-semibold">Выберите ваш лайн:</label>
        <select id="lane-select" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-md">
            <option value="Jungle">Лес (Jungle)</option>
            <option value="Roam">Роум (Roam)</option>
            <option value="Exp">Опыт (Exp)</option>
            <option value="Gold">Золото (Gold)</option>
        </select>

        <label class="block text-sm font-semibold">Враг на линии:</label>
        <select id="enemy-select" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-md text-white">
            <!-- Сюда JS подгрузит список имен -->
        </select>
        
        <button onclick="get1v1Counter()" class="w-full bg-green-600 hover:bg-green-700 p-3 rounded-md font-bold mt-2">Найти контрпик</button>
        <div id="result-1v1" class="mt-4 space-y-2"></div>
    </div>

    <!-- ИНТЕРФЕЙС 5х5 -->
    <div id="mode-5v5" class="space-y-4 hidden">
        <p class="text-sm text-slate-400">Выберите пикнутых героев для анализа:</p>
        <div>
            <label class="block text-xs font-semibold uppercase text-red-400 mb-1">Герой врага №1:</label>
            <select id="enemy-1" class="hero-pool-select w-full bg-slate-800 border border-slate-700 p-2 rounded-md mb-2"></select>
            <label class="block text-xs font-semibold uppercase text-red-400 mb-1">Герой врага №2:</label>
            <select id="enemy-2" class="hero-pool-select w-full bg-slate-800 border border-slate-700 p-2 rounded-md"></select>
        </div>
        <div>
            <label class="block text-xs font-semibold uppercase text-blue-400 mb-1">Наш пик №1:</label>
            <select id="our-1" class="hero-pool-select w-full bg-slate-800 border border-slate-700 p-2 rounded-md"></select>
        </div>

        <button onclick="get5v5Counter()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-md font-bold mt-2">Рассчитать идеальный драфт</button>
        <div id="result-5v5" class="mt-4 space-y-2"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Замени на URL своего бэкенда (или ngrok)
        const API_URL = "http://localhost:8000/api"; 

        // Загрузка списка героев при старте аппки
        async function loadHeroes() {
            try {
                const response = await fetch(`${API_URL}/heroes`);
                const heroes = await response.json();
                
                const selects = [
                    document.getElementById('enemy-select'),
                    document.getElementById('enemy-1'),
                    document.getElementById('enemy-2'),
                    document.getElementById('our-1')
                ];
                
                selects.forEach(select => {
                    select.innerHTML = "";
                    heroes.forEach(name => {
                        let opt = document.createElement('option');
                        opt.value = name;
                        opt.innerText = name;
                        select.appendChild(opt);
                    });
                });
            } catch (e) {
                console.error("Ошибка подключения к API бэкенда", e);
            }
        }

        function switchMode(mode) {
            if (mode === '1v1') {
                document.getElementById('mode-1v1').classList.remove('hidden');
                document.getElementById('mode-5v5').classList.add('hidden');
                document.getElementById('btn-1v1').className = "w-1/2 py-2 text-center rounded-md font-medium bg-yellow-500 text-slate-900";
                document.getElementById('btn-5v5').className = "w-1/2 py-2 text-center rounded-md font-medium text-slate-400";
            } else {
                document.getElementById('mode-1v1').classList.add('hidden');
                document.getElementById('mode-5v5').classList.remove('hidden');
                document.getElementById('btn-5v5').className = "w-1/2 py-2 text-center rounded-md font-medium bg-yellow-500 text-slate-900";
                document.getElementById('btn-1v1').className = "w-1/2 py-2 text-center rounded-md font-medium text-slate-400";
            }
        }

        async function get1v1Counter() {
            const lane = document.getElementById('lane-select').value;
            const enemyName = document.getElementById('enemy-select').value;
            const resBox = document.getElementById('result-1v1');
            resBox.innerHTML = "Поиск решений...";

            const response = await fetch(`${API_URL}/counter/lane?enemy_name=${enemyName}&lane=${lane}`);
            const data = await response.json();

            resBox.innerHTML = "";
            if(data.length === 0) { resBox.innerHTML = "<p class='text-sm text-slate-400'>В этой категории явных контрпиков не найдено.</p>"; return; }
            
            data.forEach(item => {
                resBox.innerHTML += `
                    <div class="bg-slate-800 p-3 rounded-md border-l-4 border-yellow-500">
                        <div class="font-bold text-yellow-400">${item.hero_name}</div>
                        <div class="text-sm text-slate-300 mt-1">${item.reason}</div>
                    </div>`;
            });
        }

        async function get5v5Counter() {
            const enemyTeam = [document.getElementById('enemy-1').value, document.getElementById('enemy-2').value];
            const ourTeam = [document.getElementById('our-1').value];
            const resBox = document.getElementById('result-5v5');
            resBox.innerHTML = "Алгоритм вычисляет синергию...";

            const response = await fetch(`${API_URL}/counter/draft`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ enemy_team: enemyTeam, our_team: ourTeam })
            });
            const data = await response.json();

            resBox.innerHTML = "";
            if(data.length === 0) { resBox.innerHTML = "<p class='text-sm text-slate-400'>Нет подходящих вариантов драфта.</p>"; return; }
            
            data.forEach(item => {
                let reasonsHtml = item.reasons.map(r => `<div class='text-xs text-slate-300 mt-1'>• ${r}</div>`).join('');
                resBox.innerHTML += `
                    <div class="bg-slate-800 p-3 rounded-md border-l-4 border-blue-500">
                        <div class="flex justify-between font-bold">
                            <span>${item.name} (${item.role})</span>
                            <span class="text-xs text-green-400">${item.status}</span>
                        </div>
                        <div class="text-xs text-slate-400">Линия: ${item.lane}</div>
                        ${reasonsHtml}
                    </div>`;
            });
        }

        // Запуск подгрузки базы при открытии
        loadHeroes();
    </script>
</body>
</html>
